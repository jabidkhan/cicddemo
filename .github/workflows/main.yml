name: Java Spring Boot Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Initialize Repo
        run: |
          echo "This is DevOps Molvi"
          uname -a

      - name: Check Docker Installation
        run: |
          docker --version
          docker images

      - name: Run Docker Container
        run: |
          docker run hello-world
